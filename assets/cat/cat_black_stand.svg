<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" width="400" height="560" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    哥哥的黑貓 · 站立 (pose: stand)
    head 群組與 cat_black_sit.svg 完全相同，只有 transform 不同：translate(100 80)
    錨點（head 本地座標）：slot-hat (0,-44)　slot-face (0,-4)　slot-neck (0,42)
  -->
  <defs>
    <style>
      .line  { stroke:#121116; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
      .fur   { fill:#2B2A31; }
      .sheen { fill:#3D3C46; }
      .earIn { fill:#5A4652; }
      .crease{ stroke:#121116; stroke-width:2.5; stroke-linecap:round; fill:none; }
      .whisk { stroke:#9A98A4; stroke-width:1.8; stroke-linecap:round; fill:none; }
    </style>
  </defs>

  <g id="cat" data-pose="stand">

    <g id="shadow" display="none">
      <ellipse cx="100" cy="270" rx="56" ry="6" fill="#000" opacity="0.12"/>
    </g>

    <g id="tail">
      <path d="M118 246 C 150 254, 168 232, 162 208 C 158 194, 166 182, 178 184" fill="none" stroke="#121116" stroke-width="17" stroke-linecap="round"/>
      <path d="M118 246 C 150 254, 168 232, 162 208 C 158 194, 166 182, 178 184" fill="none" stroke="#2B2A31" stroke-width="11" stroke-linecap="round"/>
    </g>

    <g id="feet">
      <ellipse class="fur line" cx="84"  cy="259" rx="15" ry="9"/>
      <ellipse class="fur line" cx="116" cy="259" rx="15" ry="9"/>
      <path class="crease" d="M80 257 v5 M88 257 v5 M112 257 v5 M120 257 v5" stroke-width="1.8"/>
    </g>

    <g id="body">
      <path class="fur line" d="M100 118
        C 132 118, 142 162, 141 198
        C 140 238, 127 256, 100 256
        C 73 256, 60 238, 59 198
        C 58 162, 68 118, 100 118 Z"/>
      <path class="sheen" d="M86 142 C 93 135, 107 135, 114 142 C 107 139, 93 139, 86 142 Z"/>
    </g>

    <g id="arms">
      <path d="M66 160 C 56 176, 52 192, 54 206" fill="none" stroke="#121116" stroke-width="19" stroke-linecap="round"/>
      <path d="M66 160 C 56 176, 52 192, 54 206" fill="none" stroke="#2B2A31" stroke-width="13" stroke-linecap="round"/>
      <path d="M134 160 C 144 176, 148 192, 146 206" fill="none" stroke="#121116" stroke-width="19" stroke-linecap="round"/>
      <path d="M134 160 C 144 176, 148 192, 146 206" fill="none" stroke="#2B2A31" stroke-width="13" stroke-linecap="round"/>
    </g>

    <g id="head" transform="translate(100 80)">
      <g id="ears">
        <path class="fur line" d="M-50 -14 C -54 -40, -52 -62, -44 -76 C -32 -66, -20 -54, -12 -42 Z"/>
        <path class="earIn"    d="M-43 -24 C -46 -42, -45 -56, -41 -64 C -34 -56, -27 -48, -22 -41 Z"/>
        <path class="fur line" d="M50 -14 C 54 -40, 52 -62, 44 -76 C 32 -66, 20 -54, 12 -42 Z"/>
        <path class="earIn"    d="M43 -24 C 46 -42, 45 -56, 41 -64 C 34 -56, 27 -48, 22 -41 Z"/>
      </g>

      <path id="head-shape" class="fur line" d="M0 -45
        C 32 -46, 55 -28, 55 0
        C 55 27, 32 44, 0 44
        C -32 44, -55 27, -55 0
        C -55 -28, -32 -46, 0 -45 Z"/>
      <path class="sheen" d="M-22 -36 C -10 -42, 10 -42, 22 -36 C 10 -39, -10 -39, -22 -36 Z"/>

      <g id="face" data-mood="normal">
        <circle cx="-21" cy="-4" r="14" fill="#F2B33D" stroke="#8A5A10" stroke-width="2.5"/>
        <circle cx="21"  cy="-4" r="14" fill="#F2B33D" stroke="#8A5A10" stroke-width="2.5"/>
        <ellipse cx="-21" cy="-3" rx="5.5" ry="9.5" fill="#141318"/>
        <ellipse cx="21"  cy="-3" rx="5.5" ry="9.5" fill="#141318"/>
        <circle cx="-18" cy="-9" r="3" fill="#FFFFFF"/>
        <circle cx="24"  cy="-9" r="3" fill="#FFFFFF"/>
        <path d="M-4.5 12 h9 l-4.5 5 z" fill="#E89AA6" stroke="#C26F7E" stroke-width="1.2" stroke-linejoin="round"/>
        <!-- ω 嘴：沿用哥哥原畫 -->
        <path d="M-9 19 q 4.5 6 9 0 q 4.5 6 9 0" fill="none" stroke="#9A98A4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path class="whisk" d="M-30 12 L-52 9 M-30 17 L-51 19 M30 12 L52 9 M30 17 L51 19"/>
      </g>

      <g id="slot-face"/>
      <g id="slot-hat"/>
      <g id="slot-neck"/>
    </g>

  </g>
</svg>
