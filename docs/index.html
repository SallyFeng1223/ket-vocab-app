<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>KET 單字診斷</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #f7f7f7;
      color: #222;
    }
    #login-section,
    #app-section,
    #pet-section {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    #login-section {
      display: none;
    }
    #app-section {
      display: none;
    }
    #pet-section {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding-bottom: 0;
    }
    #coin-total {
      font-size: 20px;
      font-weight: bold;
      color: #b8860b;
    }
    h1 {
      font-size: 20px;
      text-align: center;
    }
    label {
      display: block;
      margin-top: 12px;
      font-size: 16px;
    }
    input {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 4px;
    }
    #login-form button {
      width: 100%;
      margin-top: 16px;
      padding: 12px;
      font-size: 18px;
    }
    #login-error {
      color: #c00;
      margin-top: 12px;
      white-space: pre-wrap;
    }
    .progress {
      text-align: center;
      font-size: 16px;
      color: #666;
      margin-bottom: 16px;
    }
    .prompt {
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      margin: 24px 0 32px;
      word-break: break-word;
    }
    .hint {
      text-align: center;
      font-size: 20px;
      color: #b8860b;
      margin: -16px 0 24px;
    }
    .summary {
      text-align: center;
      margin-top: 64px;
    }
    .summary-line {
      font-size: 24px;
      margin: 12px 0;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .choice-btn {
      min-height: 60px;
      font-size: 24px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #fff;
      user-select: none;
      -webkit-user-select: none;
    }
    .choice-btn:disabled {
      opacity: 0.6;
    }
    .answer-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-height: 56px;
      margin-bottom: 16px;
      padding: 8px;
      border: 2px dashed #999;
      border-radius: 8px;
    }
    .tile-pool {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }
    .tile-btn {
      min-width: 48px;
      min-height: 48px;
      font-size: 22px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #fff;
      user-select: none;
      -webkit-user-select: none;
    }
    .tile-btn:disabled {
      opacity: 0.3;
    }
    .answer-tile {
      background: #eef6ff;
    }
    .tile-controls {
      display: flex;
      gap: 12px;
    }
    .tile-control-btn {
      flex: 1;
      min-height: 48px;
      font-size: 18px;
      border: 2px solid #333;
      border-radius: 8px;
      background: #fff;
      user-select: none;
      -webkit-user-select: none;
    }
    .done-message,
    .error-message {
      text-align: center;
      font-size: 24px;
      margin-top: 64px;
    }
  </style>
</head>
<body>
  <section id="login-section">
    <h1>KET 單字診斷 — 登入</h1>
    <form id="login-form">
      <label for="email">Email</label>
      <input id="email" type="email" required autocomplete="username" />
      <label for="password">密碼</label>
      <input id="password" type="password" required autocomplete="current-password" />
      <button type="submit">登入</button>
    </form>
    <div id="login-error"></div>
  </section>

  <section id="pet-section">
    <div id="pet-container"></div>
    <div id="coin-total"></div>
  </section>

  <section id="app-section"></section>

  <script type="module" src="js/main.js?v=12"></script>
</body>
</html>
